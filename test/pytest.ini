[pytest]
# Run from anywhere with:
#   backend\python\python.exe -m pytest -c test\pytest.ini test\backend -q
# rootdir is this directory, so every relative path below stays inside test\.
cache_dir = .pytest_cache
testpaths = backend
pythonpath = ../backend backend
python_files = test_*.py
# no:anyio - anyio's auto-loaded pytest plugin would import anyio before conftest.py removes the per-user
# site-packages from sys.path (see conftest.py); the tests do not use it.
addopts = -p no:legacypath -p no:anyio --strict-markers
markers =
    slow: tests that take more than a few seconds
    gpu: tests that need the real GPU / model weights
filterwarnings =
    error::pytest.PytestUnraisableExceptionWarning
    ignore:Using .httpx. with .starlette.testclient. is deprecated
    ignore::PIL.Image.DecompressionBombWarning
log_level = INFO
